<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dept IG Content Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,18,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1B19; --ink-soft:#4A4640; --paper:#F4F2ED; --card:#FFFFFF;
    --line:#E2DDD3; --line-strong:#CFC8BA; --slate:#5B6B73;
    --glow:#D6531F; --glow-soft:#F0A878; --glow-bg:#FBEAE0;
    --green:#2E6B4F; --green-bg:#E6F0EA;
    --radius:10px; --shadow:0 1px 2px rgba(28,27,25,.05), 0 8px 24px rgba(28,27,25,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .mono{font-family:"IBM Plex Mono",monospace;}
  h1,h2,h3,.display{font-family:"Space Grotesk",sans-serif;}

  header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;background:rgba(244,242,237,.85);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .reactor{width:30px;height:30px;border-radius:7px;flex:none;background:radial-gradient(circle at 50% 120%, var(--glow) 0%, #8A2B0C 65%, #3A1404 100%);box-shadow:0 0 0 1px rgba(0,0,0,.1), 0 0 14px -2px var(--glow);position:relative;}
  .reactor::after{content:"";position:absolute;inset:6px 6px auto 6px;height:3px;border-radius:2px;background:linear-gradient(90deg,#FFD9A8,#FF7A33);opacity:.9;}
  .brand h1{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0;white-space:nowrap;}
  .brand .sub{font-size:12px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .acts{display:flex;align-items:center;gap:8px;flex:none;}

  button{font-family:inherit;font-size:14px;cursor:pointer;border:none;background:none;}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font-weight:500;transition:.12s;}
  .btn:hover{border-color:var(--slate);}
  .btn.primary{background:var(--glow);border-color:var(--glow);color:#fff;}
  .btn.primary:hover{background:#BC4716;border-color:#BC4716;}
  .btn.primary:disabled{background:var(--glow-soft);border-color:var(--glow-soft);cursor:not-allowed;}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--slate);padding:8px 10px;}
  .btn.ghost:hover{color:var(--ink);background:rgba(0,0,0,.04);}
  .btn.sm{padding:6px 11px;font-size:13px;}
  .btn.green{background:var(--green);border-color:var(--green);color:#fff;}
  .btn.green:hover{background:#245540;border-color:#245540;}
  button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--glow);outline-offset:2px;}

  main{max-width:1240px;margin:0 auto;padding:22px;display:grid;grid-template-columns:1fr 1.15fr;gap:22px;align-items:start;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .panel-head{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--line);}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);}
  .panel-body{padding:18px;}

  .types{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px;margin-bottom:18px;}
  .type{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:12.5px;font-weight:500;color:var(--ink-soft);text-align:center;transition:.12s;}
  .type svg{width:20px;height:20px;}
  .type:hover{border-color:var(--line-strong);}
  .type.active{background:var(--glow-bg);border-color:var(--glow);color:#8A2B0C;}

  label.fld{display:block;margin-bottom:14px;}
  label.fld .lab{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  label.fld .hint{font-weight:400;color:var(--slate);}
  input[type=text],input[type=password],input[type=date],input[type=color],textarea,select{width:100%;font-family:inherit;font-size:14px;color:var(--ink);padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;}
  input[type=color]{height:38px;padding:4px;cursor:pointer;}
  textarea{resize:vertical;min-height:84px;line-height:1.5;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .doi-row{display:flex;gap:8px;}
  .doi-row input{flex:1;}

  .meta-card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:14px;font-size:13px;}
  .meta-card .t{font-weight:600;margin-bottom:3px;}
  .meta-card .m{color:var(--slate);}

  .drop{border:1.5px dashed var(--line-strong);border-radius:9px;padding:18px;text-align:center;color:var(--slate);font-size:13.5px;cursor:pointer;transition:.12s;background:var(--paper);}
  .drop:hover{border-color:var(--glow);color:var(--glow);}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .thumb button{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .thumb .order{position:absolute;left:3px;bottom:3px;min-width:20px;height:20px;padding:2px 5px;border-radius:10px;background:rgba(0,0,0,.72);color:#fff;font:600 11px "IBM Plex Mono",monospace;text-align:center;}
  .thumb button.move-left,.thumb button.move-right{top:auto;bottom:2px;background:rgba(0,0,0,.72);}
  .thumb button.move-left{right:22px;}
  .thumb button.move-right{right:2px;}

  .glowbar{height:3px;border-radius:2px;background:var(--line);overflow:hidden;}
  .glowbar.on::before{content:"";display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--glow),#FFC78A,var(--glow),transparent);animation:ramp 1.1s ease-in-out infinite;}
  @keyframes ramp{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}

  /* draft panel */
  .out-empty{color:var(--slate);font-size:14px;text-align:center;padding:48px 14px;line-height:1.6;}
  .out-empty .reactor{margin:0 auto 14px;width:40px;height:40px;}
  .tabs{display:flex;gap:4px;padding:4px;background:var(--paper);border-radius:9px;margin-bottom:16px;}
  .tab{flex:1;padding:8px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--slate);text-align:center;}
  .tab.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}

  .caption-out{width:100%;min-height:140px;font-size:14.5px;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .tag{font-family:"IBM Plex Mono",monospace;font-size:12px;border-radius:6px;padding:3px 8px;}
  .tag.on{background:var(--glow-bg);border:1px solid var(--glow-soft);color:#8A2B0C;cursor:pointer;}
  .tag-editor{display:flex;gap:8px;align-items:center;margin-top:10px;}
  .tag-editor input{flex:1;min-width:0;}
  .tag-editor .btn{white-space:nowrap;}
  .counts{display:flex;gap:16px;margin-top:12px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--slate);}
  .counts b{color:var(--ink);font-weight:500;}
  .counts .warn{color:var(--glow);}
  .alt{margin-top:14px;font-size:13px;color:var(--ink-soft);}
  .alt .lab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);display:block;margin-bottom:4px;}
  .out-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}

  /* graphic tab */
  .canvas-wrap{display:flex;justify-content:center;background:var(--paper);border-radius:10px;padding:14px;border:1px solid var(--line);}
  #card{display:none;}
  .gctrls{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .gctrls .full{grid-column:1 / -1;}
  .gctrls label.fld{margin-bottom:0;}
  .seg{display:flex;gap:4px;padding:3px;background:var(--paper);border-radius:8px;}
  .seg button{flex:1;padding:6px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--slate);}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}
  .style-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}
  .style-choice{position:relative;display:block;cursor:pointer;}
  .style-choice input{position:absolute;opacity:0;pointer-events:none;}
  .style-card{display:flex;flex-direction:column;min-height:92px;height:100%;padding:11px;border:1.5px solid var(--line-strong);border-radius:9px;background:var(--card);overflow:hidden;transition:.12s;}
  .style-card .name{display:block;font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.25;}
  .style-card .desc{display:block;font-size:11px;color:var(--slate);line-height:1.3;margin-top:3px;}
  .style-choice input:checked + .style-card{border-color:#001E5F;box-shadow:0 0 0 2px rgba(0,30,95,.12);}
  .style-choice input:focus-visible + .style-card{outline:2px solid #FFD82B;outline-offset:2px;}
  .swatches{display:flex;gap:4px;margin-top:auto;padding-top:8px;}
  .swatches i{display:block;width:18px;height:8px;border-radius:6px;border:1px solid rgba(0,0,0,.09);}
  .slide-editor{grid-column:1 / -1;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:12px;}
  .slide-editor-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .slide-editor-head .btn{padding:5px 9px;}
  .slide-strip{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;}
  .slide-choice{position:relative;flex:0 0 58px;height:58px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#fff;}
  .slide-choice.on{border-color:var(--glow);box-shadow:0 0 0 2px rgba(214,83,31,.12);}
  .slide-choice img{width:100%;height:100%;object-fit:cover;display:block;}
  .slide-choice span{position:absolute;left:3px;bottom:3px;min-width:18px;height:18px;padding:1px 4px;border-radius:9px;background:rgba(0,0,0,.72);color:#fff;font:600 10px "IBM Plex Mono",monospace;}
  .overlay-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:11px;}
  .overlay-controls .full{grid-column:1 / -1;}
  .overlay-controls label.fld{margin:0;}
  .overlay-opacity{display:flex;align-items:center;gap:10px;min-height:38px;}
  .overlay-opacity input{flex:1;min-width:0;accent-color:var(--glow);}
  .overlay-opacity output{min-width:42px;text-align:right;font:600 12px "IBM Plex Mono",monospace;color:var(--ink-soft);}
  .design-section{grid-column:1 / -1;border:1px solid var(--line);border-radius:9px;padding:12px;min-width:0;}
  .design-section summary{cursor:pointer;font-weight:600;font-size:14px;}
  .design-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px;}
  .design-grid .full{grid-column:1 / -1;}
  .design-grid label.fld .lab,.design-library label.fld .lab{font-size:14px;}
  .design-grid .hint,.design-note{font-size:13px;color:var(--slate);line-height:1.5;}
  .design-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
  .design-status{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:13px;color:var(--slate);}
  .design-status strong{color:var(--ink);}
  .design-check{display:flex;align-items:center;gap:8px;font-size:14px;}
  .design-check input{accent-color:var(--glow);width:17px;height:17px;}
  .design-library{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .design-preview{position:sticky;top:78px;z-index:5;}
  .design-preview .canvas-wrap{background:#e7e8eb;}
  .design-preview-note{margin:0;padding:7px 10px;background:var(--card);font-size:13px;color:var(--slate);border-radius:0 0 8px 8px;}
  .preview-tools{display:flex;justify-content:flex-end;padding:6px 0;background:var(--card);}
  .graphic-zoom-dialog{width:min(1400px,96vw);height:94dvh;max-width:96vw;max-height:94dvh;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);}
  .graphic-zoom-dialog[open]{display:flex;flex-direction:column;}
  .graphic-zoom-dialog::backdrop{background:rgba(15,20,30,.7);}
  .graphic-zoom-head,.graphic-zoom-tools{display:flex;align-items:center;gap:10px;padding:12px 16px;flex:none;}
  .graphic-zoom-head{justify-content:space-between;border-bottom:1px solid var(--line);}
  .graphic-zoom-head h2{margin:0;font-size:18px;}
  .graphic-zoom-tools{flex-wrap:wrap;font-size:14px;}
  .graphic-zoom-tools select{width:auto;min-width:100px;}
  .graphic-zoom-tools output{color:var(--slate);font-variant-numeric:tabular-nums;}
  .graphic-zoom-viewport{flex:1;min-height:0;min-width:0;overflow:auto;overscroll-behavior:contain;background:#e7e8eb;}
  .graphic-zoom-viewport:focus-visible{outline:2px solid var(--glow);outline-offset:-3px;}
  .graphic-zoom-surface{width:max-content;min-width:100%;min-height:100%;padding:20px;display:grid;place-items:center;}
  #cardZoom{display:block;max-width:none;max-height:none;box-shadow:0 2px 15px rgba(0,0,0,.18);}
  .graphic-zoom-hint{margin:0;padding:8px 16px;font-size:13px;color:var(--slate);}
  @media(max-width:520px){.graphic-zoom-head,.graphic-zoom-tools{padding:10px;gap:8px;}.graphic-zoom-head h2{font-size:16px;}.graphic-zoom-tools .btn{padding:8px 12px;}}
  .style-card .name{font-size:14px;}.style-card .desc{font-size:12px;}
  @media(max-width:900px){.design-preview{top:70px;}.design-preview #cardDisp{max-height:36vh;width:auto!important;max-width:100%!important;}.design-preview .canvas-wrap{padding:8px;}}
  @media(max-width:520px){.design-grid{grid-template-columns:1fr;}.design-grid .full{grid-column:auto;}header{flex-wrap:wrap;position:relative;}header .acts{flex-wrap:wrap;}.design-preview{top:0;}}

  /* queue */
  .queue-wrap{max-width:1240px;margin:0 auto 40px;padding:0 22px;}
  .queue-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px;}
  .queue-head h2{font-size:16px;margin:0;}
  .qcount{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--slate);}
  .qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow);}
  .qcard .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .pill{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--green-bg);color:var(--green);}
  .qcard .cap{font-size:13px;line-height:1.5;max-height:84px;overflow:hidden;color:var(--ink-soft);}
  .qcard .qacts{display:flex;gap:6px;margin-top:10px;}
  .qempty{color:var(--slate);font-size:13.5px;padding:8px 0;}

  .scrim{position:fixed;inset:0;background:rgba(28,27,25,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;}
  .paper-steps{font-size:12px;line-height:1.8;color:var(--slate);padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;margin:0 0 18px}.paper-steps span{padding:0 5px}.selected-paper-image{display:flex;gap:15px;align-items:center;border:1px solid #a9c9b8;background:#f1f8f3;border-radius:10px;padding:14px;margin-bottom:18px}.selected-paper-image img{width:76px;height:95px;object-fit:contain;background:white;border-radius:5px;flex-shrink:0}.selected-paper-image strong{font-size:14px}.selected-paper-image p,.caption-next{font-size:13px;line-height:1.55;margin:6px 0 10px}.tabs button.tab{background:transparent;border:0;font-family:inherit}.tabs button.tab.active{background:var(--card);border-bottom:2px solid var(--glow)}
  .modal{background:var(--card);border-radius:14px;max-width:480px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto;}.modal [hidden]{display:none!important}
  .modal h2{margin:0 0 6px;font-size:19px;}
  .modal p{color:var(--ink-soft);font-size:13.5px;margin:0 0 16px;}
  .modal .note{font-size:12px;color:var(--slate);margin-top:12px;line-height:1.5;}
  .modal.wide{max-width:900px;}
  .ai-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ai-options .full{grid-column:1/-1}.ai-result{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}.ai-result img{display:block;max-width:100%;max-height:460px;margin:0 auto 15px;border-radius:7px}.ai-status{font-size:13px;line-height:1.5;margin:12px 0;color:var(--ink-soft)}.ai-source{min-height:120px}.ai-prompt{min-height:180px;font-size:12px!important}.ai-help{font-size:12px;line-height:1.55;color:var(--slate)}.ai-heading{display:flex;align-items:center;justify-content:space-between;gap:15px}.ai-heading button{flex-shrink:0}@media(max-width:560px){.ai-options{grid-template-columns:1fr}.ai-options .full{grid-column:auto}.ai-heading{align-items:flex-start}}
  .review-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px;}
  .review-card{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--paper);}
  .review-card h3{font-size:15px;margin:7px 0 4px;line-height:1.3;}
  .review-card .meta{font-size:12px;color:var(--slate);}
  .review-card .desc{font-size:13px;color:var(--ink-soft);margin-top:8px;max-height:64px;overflow:hidden;}
  .review-card .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .loaded-review{border-left:4px solid var(--glow);display:flex;justify-content:space-between;gap:12px;align-items:start;}
  .loaded-review button{color:var(--slate);font-size:12px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:60;box-shadow:var(--shadow);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .err{background:var(--glow-bg);border:1px solid var(--glow-soft);color:#8A2B0C;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px;}
  .hide{display:none !important;}

  @media (max-width:900px){
    main{grid-template-columns:1fr;padding:14px;gap:14px;}
    .brand .sub{display:none;}
    .gctrls{grid-template-columns:1fr;}
    .panel-body{padding:15px;}
    input[type=text],input[type=date],textarea,select{font-size:16px;} /* stops iOS zoom-on-focus */
    .modal .row{flex-direction:column;gap:0;}
    .out-acts .btn{flex:1;justify-content:center;}
    #cardDisp{max-width:100% !important;}
  }
  @media (max-width:520px){.overlay-controls{grid-template-columns:1fr;}.overlay-controls .full{grid-column:auto;}}
  @media (prefers-reduced-motion:reduce){ .glowbar.on::before{animation:none;width:100%;opacity:.5;} *{transition:none !important;} }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="reactor" aria-hidden="true"></div>
    <div style="min-width:0"><h1>Dept IG Content Studio</h1><div class="sub" id="brandSub">Source → caption + graphic → approve</div></div>
  </div>
  <div class="acts">
    <button class="btn ghost sm" id="reviewBtn">Review queue</button>
    <button class="btn ghost sm" id="settingsBtn">Voice &amp; brand</button>
    <button class="btn ghost sm" id="keyBtn">API keys</button>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-head"><span class="eyebrow">01 / Source</span></div>
    <div class="panel-body">
      <div class="types" id="types"></div>
      <div id="formArea"></div>
      <details class="design-section" style="margin-bottom:14px"><summary>Creative direction <span class="hint">(optional)</span></summary><label class="fld" style="margin:10px 0 0"><span class="lab">Direction for the graphic text</span><textarea id="creativeDirection" maxlength="800" placeholder="e.g. Lead with a question, emphasize the students, or give this series a playful headline."></textarea><span class="design-note">Used when generating the headline and subhead. Fine-tune the visual design in the Graphic tab.</span></label></details>

}

function renderLoadedReviewBanner(){

function handleReel(f){
  if(!f||!f.type.startsWith("video/"))return;
  cancelPendingReviewMedia_();
  const drop=document.getElementById("reelDrop"); if(drop)drop.textContent="Reading the clip…";
  grabFrame(f).then(url=>{

    if(drop)drop.innerHTML = url?"Cover frame captured ✓ — tap to use a different clip":"Couldn't read that clip — you can still caption from your note";
    renderReelThumb();

function grabFrame(file){
  return new Promise(res=>{
    try{
      const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";v.src=URL.createObjectURL(file);
      v.onloadeddata=()=>{
        const duration=v.duration||2;
        v.currentTime=Math.max(0,Math.min(duration-0.1,Math.max(1,duration*0.25)));
      };
      v.onseeked=()=>{try{const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);res(c.toDataURL("image/jpeg",0.9));}catch(e){res(null);}URL.revokeObjectURL(v.src);};
      v.onerror=()=>res(null);
    }catch(e){res(null);}
  });
}

/* ===== photo / carousel (becomes the post) ===== */
async function handlePhoto(list){
  const files=Array.from(list||[]);if(!files.length)return;
  if(photos.length+files.length>MAX_CAROUSEL_IMAGES){toast(`A carousel can contain up to ${MAX_CAROUSEL_IMAGES} images`);return;}
  if(files.some(f=>!/^image\/(jpeg|png|webp)$/.test(f.type))){toast("Use JPEG, PNG, or WebP images");return;}
  if(files.some(f=>f.size>8*1024*1024)){toast("Each image must be 8 MB or smaller");return;}
  const existingBytes=photos.reduce((sum,p)=>sum+(p.size||0),0),newBytes=files.reduce((sum,f)=>sum+f.size,0);
  if(existingBytes+newBytes>MAX_CAROUSEL_BYTES){toast("Keep carousel images under 30 MB total");return;}
  cancelPendingReviewMedia_();
  try{photos=photos.concat(await Promise.all(files.map(readPhotoFile_)));syncCurrentSlides_();renderThumbs();const drop=document.getElementById("drop");if(drop)drop.innerHTML=`${photos.length} photo${photos.length===1?"":"s"} ready — <b>click or drop to add more</b><br><span style="font-size:12px">Up to ${MAX_CAROUSEL_IMAGES} images in carousel order · JPEG, PNG, or WebP</span>`;}
  catch(e){toast("One of those images could not be read");}
}
function withPlainOverlayDefaults_(slide){return{...PLAIN_OVERLAY_DEFAULTS,...(slide||{})};}
function readPhotoFile_(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(withPlainOverlayDefaults_({dataUrl:reader.result,name:file.name,mediaType:file.type,size:file.size,overlayCaption:""}));reader.onerror=reject;reader.readAsDataURL(file);});}
function syncCurrentSlides_(){
  if(!currentGraphic)return;
  const previous=currentSlides||[];
  currentSlides=photos.map(photo=>{const prior=previous.find(slide=>slide.dataUrl===photo.dataUrl);return withPlainOverlayDefaults_({...photo,...(prior||{})});});
  activeSlideIndex=Math.min(activeSlideIndex,Math.max(0,currentSlides.length-1));
  currentGraphic.figure=currentSlides[activeSlideIndex]?currentSlides[activeSlideIndex].dataUrl:null;
  if(document.getElementById("cardDisp"))renderGraphicTab();
}
function renderThumbs(){const t=document.getElementById("thumbs");if(!t)return;t.innerHTML="";photos.forEach((p,i)=>{const d=document.createElement("div");d.className="thumb";d.innerHTML=`<img src="${p.dataUrl}" alt="Carousel image ${i+1}"><span class="order">${i+1}</span><button class="remove" aria-label="Remove image ${i+1}">×</button>${photos.length>1?`<button class="move-left" aria-label="Move image ${i+1} earlier"${i===0?" disabled":""}>←</button><button class="move-right" aria-label="Move image ${i+1} later"${i===photos.length-1?" disabled":""}>→</button>`:""}`;d.querySelector(".remove").onclick=()=>{photos.splice(i,1);syncCurrentSlides_();renderThumbs();updatePhotoDrop_();};const left=d.querySelector(".move-left"),right=d.querySelector(".move-right");if(left)left.onclick=()=>movePhoto_(i,-1);if(right)right.onclick=()=>movePhoto_(i,1);t.appendChild(d);});}
function movePhoto_(index,direction){const target=index+direction;if(target<0||target>=photos.length)return;const held=photos[index];photos[index]=photos[target];photos[target]=held;syncCurrentSlides_();renderThumbs();}
function updatePhotoDrop_(){const drop=document.getElementById("drop");if(!drop)return;drop.innerHTML=photos.length?`${photos.length} photo${photos.length===1?"":"s"} ready — <b>click or drop to add more</b><br><span style="font-size:12px">Up to ${MAX_CAROUSEL_IMAGES} images in carousel order · JPEG, PNG, or WebP</span>`:`Drop one or more photos or <b>click to upload</b><br><span style="font-size:12px">Up to ${MAX_CAROUSEL_IMAGES} images in carousel order · JPEG, PNG, or WebP</span>`;}

function normalizedPaperLink_(value){
  const raw=String(value||"").trim().replace(/^https?:\/\/(?:dx\.)?doi\.org\//i,"");
  return /^10\.\d{4,9}\/[^\s<>]+$/i.test(raw)?"https://doi.org/"+raw.toLowerCase():safeSourceLink_(raw);
}
function defaultPaperCredit_(){
  if(reviewSource&&String(reviewSource.type).toLowerCase()==="paper"&&reviewSource.credit)return String(reviewSource.credit).trim().slice(0,300);
  const local=paperMeta&&paperMeta.rochesterAuthors||[];
  return local.length?local.join(", ").slice(0,300):(paperMeta&&(paperMeta.authorCredit||paperMeta.authors)||"").slice(0,300);
}
function sameDraftSource_(built){

/* ===== DOI via Crossref (slash-safe) ===== */
async function fetchDoi(){
  let raw=(document.getElementById("doi").value||"").trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i,"");
  if(!raw){toast("Enter a DOI first");return;}
  const path=raw.split("/").map(encodeURIComponent).join("/"); // keep the slash
  const btn=document.getElementById("fetchDoi");btn.textContent="…";btn.disabled=true;
  try{
    const r=await fetch("https://api.crossref.org/works/"+path+"?mailto=studio@example.edu",{headers:{"Accept":"application/json"}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const m=(await r.json()).message;
    const authorList=m.author||[];
    const auth=authorList.map(a=>[a.given,a.family].filter(Boolean).join(" ")).filter(Boolean).join(", ");
    const firstAuthor=authorList[0]?[authorList[0].given,authorList[0].family].filter(Boolean).join(" "):"";
    const authorCredit=firstAuthor+(authorList.length>1?" et al.":"");
    const rochesterAuthors=authorList.filter(a=>(a.affiliation||[]).some(aff=>/\b(?:university of rochester|rochester university)\b/i.test(aff.name||""))).map(a=>[a.given,a.family].filter(Boolean).join(" ")).filter(Boolean);
    const priorDefault=defaultPaperCredit_(),creditField=document.getElementById("paperCredit");
    paperMeta={doi:normalizedPaperLink_(raw),title:(m.title&&m.title[0])||"(untitled)",authors:auth||"",authorCredit:authorCredit,rochesterAuthors,journal:(m["container-title"]&&m["container-title"][0])||"",year:(((m.published||{})["date-parts"]||[[]])[0]||[])[0]||"",abstract:(m.abstract||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim()};
    if(creditField&&(!creditField.value.trim()||creditField.value===priorDefault))creditField.value=defaultPaperCredit_();
    renderPaperMeta();
    if(paperMeta.abstract)document.getElementById("paperText").value=paperMeta.abstract;
    refreshDraftAction_();
    toast("Fetched ✓");
  }catch(e){console.error("DOI fetch failed:",e);toast("Couldn't fetch that DOI — paste the abstract instead");}
  btn.textContent="Fetch";btn.disabled=false;
}

/* ===== build brief ===== */
function buildBrief(){
  if(activeType==="paper"){
    const txt=val("paperText"),angle=val("paperAngle");
    if(!txt&&!paperMeta)return{error:"Add a DOI or paste an abstract first."};
    let b="CONTENT TYPE: New research paper highlight.\n";
    if(paperMeta)b+=`Title: ${paperMeta.title}\nAuthors: ${paperMeta.authors}\nJournal: ${paperMeta.journal} ${paperMeta.year}\n`;
    if(txt)b+=`Summary/abstract: ${txt}\n`; if(angle)b+=`Angle: ${angle}\n`;
    const credit=val("paperCredit")||defaultPaperCredit_();if(credit)b+=`Research credit for the caption: ${credit}\n`;
    const sourceKey="paper:"+(normalizedPaperLink_(val("doi"))||(reviewSource&&reviewSource.submissionId)||txt||(paperMeta&&paperMeta.title)||"");
    return{brief:b,sourceKey,paperCredit:credit,withImage:!!figure,meta1:paperMeta?(paperMeta.authorCredit||paperMeta.authors):"",meta2:paperMeta?(paperMeta.journal+(paperMeta.year?" · "+paperMeta.year:"")):"",eyebrow:"New publication"};
  }
  if(activeType==="event"){
    const title=val("evTitle"); if(!title)return{error:"Give the event a title first."};
    let b="CONTENT TYPE: Event / announcement.\nTitle: "+title+"\n";
    const date=val("evDate"),time=val("evTime"),loc=val("evLoc"),desc=val("evDesc"),link=val("evLink");
    if(date||time)b+=`When: ${date}${time?" "+time:""}\n`; if(loc)b+=`Where: ${loc}\n`; if(desc)b+=`Details: ${desc}\n`; if(link)b+=`Link: ${link}\n`;
    const dstr=date?new Date(date+"T00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}):"";
    return{brief:b,withImage:!!figure,meta1:[dstr,time].filter(Boolean).join(" · "),meta2:loc,eyebrow:"Event",headlineHint:title};
  }
  if(activeType==="reel"){
    const note=val("reelNote"); reelVideoLink=extractDriveFileId(val("reelLink"));
    if(!reelVideoLink)return{error:"Add a valid Google Drive video link. The Make Reel route downloads the MP4 or MOV file from Drive."};
    let b="CONTENT TYPE: Instagram Reel (short vertical video). Write a Reel-style caption with a strong first-line hook"+(reelCover?" for the attached cover frame.":".")+"\n";
    if(note)b+=`What happens: ${note}\n`;
    return{brief:b,withImage:!!reelCover,meta1:getSettings().handle,meta2:"",eyebrow:"Reel"};
  }
  if(activeType==="photo"){
    if(!photos.length)return{error:"Add at least one photo first."};
    const note=val("photoNote");
    let b=`CONTENT TYPE: Photo ${photos.length>1?"carousel":"post"} (lab life / people). Write one traditional Instagram caption for the ${photos.length>1?"attached images":"attached image"}.\n`;
    if(note)b+=`Context: ${note}\n`;
    return{brief:b,withImage:true,meta1:getSettings().handle,meta2:"",eyebrow:""};
  }
  if(activeType==="repost"){
    const handle=val("rpHandle"),what=val("rpWhat");
    if(!what)return{error:"Describe what they posted first."};
    let b="CONTENT TYPE: Reposting a department member's content. Credit them clearly.\n";
    if(handle)b+=`Original author: ${handle}\n`; b+=`What they shared: ${what}\n`;
    const why=val("rpWhy"); if(why)b+=`Why amplify: ${why}\n`;
    const link=val("rpLink"); if(link)b+=`Source link: ${link}\n`;
    return{brief:b,withImage:!!figure,meta1:handle?"via "+handle:"",meta2:"",eyebrow:"Spotlight"};
  }
  return{error:"Pick a content type."};
}

/* ===== AI artwork: generated media is reviewed before it replaces the graphic ===== */
const AI_ART_STYLES={
  explainer:{name:"Simple explainer",prompt:"A clear editorial science illustration that explains one central idea with a small number of large, meaningful visual elements. Strong hierarchy and plenty of breathing room."},
  analogy:{name:"Everyday analogy",prompt:"A memorable everyday visual analogy that helps a non-specialist understand the central idea. Make the analogy visibly illustrative, not experimental evidence."},

  }

  else{state.textContent="Loading submissions…";grid.innerHTML="";}
  try{
    const data=await getReviewList_();
    if(generation!==reviewQueueGeneration)return;
    if(!data.ok)throw new Error(data.error||"Review queue failed");
    reviewQueueItemsCache=Array.isArray(data.items)?data.items:[];
    if(state.isConnected&&grid.isConnected)renderReviewItems_(reviewQueueItemsCache,false);
  }catch(e){
    if(!state.isConnected||!grid.isConnected)return;
    if(reviewQueueItemsCache)renderReviewItems_(reviewQueueItemsCache,false);
    state.innerHTML=`<div class="err">${reviewQueueItemsCache?"Showing the most recently loaded queue. ":""}${esc(reviewQueueErrorMessage_(e))}<br><button class="btn sm" id="retryReviewQueue" style="margin-top:10px">Try again</button></div>`;
    const retry=document.getElementById("retryReviewQueue");if(retry)retry.onclick=refreshReviewQueue;
  }
}
function queueJsonp(action,params){
  const base=(getSettings().publishUrl||"").trim();
  return new Promise((resolve,reject)=>{
    const cb="igsReview_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const script=document.createElement("script");
    const timeoutMs=action==="media"?120000:(action==="detail"?90000:45000);
    let settled=false;
    const timer=setTimeout(()=>finish(new Error(action==="media"?"The source image timed out.":(action==="detail"?"Loading the submission timed out.":"The review queue request timed out."))),timeoutMs);
    const finish=(err,data)=>{if(settled)return;settled=true;clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(data);};
    window[cb]=data=>finish(null,data);
    const q=new URLSearchParams({action,token:getManagerToken(),callback:cb,...params});
    script.onerror=()=>finish(new Error("Could not reach the review queue."));script.src=base+"?"+q.toString();document.head.appendChild(script);
  });
}
function reviewQueueErrorMessage_(error){
  const message=String(error&&error.message||error||"Review queue failed.");
  if(/authorization failed|not configured/i.test(message))return message+" Choose “Forget manager token” and reconnect.";
  if(/timed out|did not respond|could not reach/i.test(message))return message+" This usually means Apps Script was slow or temporarily unavailable—not that your token changed.";
  return message;
}
function setReviewCardBusy_(card,busy){
  if(!card)return;
  card.querySelectorAll("button").forEach(button=>button.disabled=busy);
}
function updateReviewQueueCount_(){
  const state=document.getElementById("reviewState"),grid=document.getElementById("reviewGrid");if(!state||!grid)return;
  const count=grid.querySelectorAll(".review-card").length;
  state.textContent=count?`${count} submission${count===1?"":"s"} waiting`:"Nothing is waiting for review.";
}
function updateCachedReviewStatus_(submissionId,status){
  if(!reviewQueueItemsCache)return;
  if(status==="New"||status==="Reviewing")reviewQueueItemsCache=reviewQueueItemsCache.map(item=>String(item.submissionId)===String(submissionId)?{...item,status}:item);
  else reviewQueueItemsCache=reviewQueueItemsCache.filter(item=>String(item.submissionId)!==String(submissionId));
}
async function legacyReviewStatus_(submissionId,status,rowNumber){
  await fetch((getSettings().publishUrl||"").trim(),{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"managerUpdate",managerToken:getManagerToken(),submissionId,status,rowNumber})});
}
async function reviewStatus(submissionId,status,card){
  setReviewCardBusy_(card,true);
  const rowNumber=card&&card.dataset.rowNumber||"";
  try{
    const data=await queueJsonp("update",{submissionId,status,rowNumber});
    if(!data.ok&&/unknown action/i.test(data.error||""))await legacyReviewStatus_(submissionId,status,rowNumber);
    else if(!data.ok)throw new Error(data.error||"Could not update that submission.");
    updateCachedReviewStatus_(submissionId,status);
    if(card)card.remove();updateReviewQueueCount_();toast(`Marked ${status.toLowerCase()} ✓`);return true;
  }catch(e){toast(reviewQueueErrorMessage_(e));setReviewCardBusy_(card,false);return false;}
}
async function loadReviewSubmission(submissionId,card){
  const state=document.getElementById("reviewState"),reviewModal=card&&card.closest(".scrim");
  const rowNumber=card&&card.dataset.rowNumber||"";
  if(state)state.textContent="Loading submission details…";
  setReviewCardBusy_(card,true);
  try{
    const data=await queueJsonp("detail",{submissionId,markReviewing:"1",includeMedia:"0",rowNumber});
    if(!data.ok||!data.item)throw new Error(data.error||"Submission could not be loaded");
    const mediaIds=(data.item.mediaFileIds||[]).length?data.item.mediaFileIds:(data.item.mediaFileId?[data.item.mediaFileId]:[]);
    const needsMedia=!!mediaIds.length&&!data.item.imageBase64;
    data.item.mediaPending=needsMedia;
    updateCachedReviewStatus_(submissionId,"Reviewing");
    applyReviewSubmission(data.item);
    if(reviewModal&&reviewModal.isConnected)reviewModal.remove();
    toast(data.item.imageBase64?"Submission and source image loaded ✓":(needsMedia?`Submission loaded ✓ — ${mediaIds.length>1?mediaIds.length+" source images are":"source image is"} loading`:"Submission loaded ✓ — no automatic source image was available"));
    if(needsMedia)loadReviewMedia_(submissionId,false);
  }catch(e){setReviewCardBusy_(card,false);if(state)state.innerHTML=`<div class="err">${esc(reviewQueueErrorMessage_(e))}</div>`;}
}
async function loadReviewMedia_(submissionId,isRetry){
  if(!reviewSource||String(reviewSource.submissionId)!==String(submissionId))return;
  const loadId=++reviewMediaLoadId;
  const mediaIds=(reviewSource.mediaFileIds||[]).length?reviewSource.mediaFileIds:(reviewSource.mediaFileId?[reviewSource.mediaFileId]:[]);
  reviewSource.mediaPending=true;reviewSource.mediaError="";renderLoadedReviewBanner();
  if(isRetry)toast(`Retrying ${mediaIds.length>1?"the source images":"the source image"}…`);
  try{
    const rowNumber=String(reviewSource.rowNumber||"");
    const responses=await Promise.all(mediaIds.map((mediaFileId,index)=>queueJsonp("media",{submissionId,mediaIndex:String(index),rowNumber}).catch(error=>({ok:false,error:String(error&&error.message||error),mediaFileId}))));
    if(loadId!==reviewMediaLoadId||!reviewSource||String(reviewSource.submissionId)!==String(submissionId))return;
    const images=responses.filter(data=>data.ok&&data.item&&data.item.imageBase64).map(data=>data.item);
    if(!images.length){const failed=responses.find(data=>!data.ok||(data.item&&!data.item.imageBase64));throw new Error((failed&&((failed.item&&failed.item.mediaError)||failed.error))||"No usable source image was returned");}
    applyReviewMedia_({submissionId,images});
    const failedCount=mediaIds.length-images.length;
    if(failedCount){reviewSource.mediaError=`${failedCount} image${failedCount===1?"":"s"} could not be loaded.`;renderLoadedReviewBanner();}
    toast(failedCount?`${images.length} of ${mediaIds.length} source images loaded`:`${images.length>1?images.length+" source images":"Source image"} loaded ✓`);
  }catch(e){
    if(loadId!==reviewMediaLoadId||!reviewSource||String(reviewSource.submissionId)!==String(submissionId))return;
    reviewSource.mediaPending=false;reviewSource.mediaError=/unknown action/i.test(String(e&&e.message||e))?"Update the Apps Script deployment to enable background image loading.":reviewQueueErrorMessage_(e);
    renderLoadedReviewBanner();toast(`The submission is ready; its source image${mediaIds.length===1?"":"s"} can be retried separately`);
  }
}
function applyReviewMedia_(item){
  if(!reviewSource||String(reviewSource.submissionId)!==String(item.submissionId))return;
  const sourceImages=(item.images&&item.images.length?item.images:[item]).filter(image=>image&&image.imageBase64).map((image,index)=>({...image,dataUrl:`data:${image.imageType||"image/jpeg"};base64,${image.imageBase64}`,overlayCaption:image.overlayCaption||((reviewSource.overlayCaptions||[])[index])||""}));
  if(!sourceImages.length)return;
  const first=sourceImages[0];reviewSource.images=sourceImages;reviewSource.imageBase64=first.imageBase64;reviewSource.imageType=first.imageType||"image/jpeg";reviewSource.imageName=first.imageName||"submission.jpg";reviewSource.mediaPending=false;reviewSource.mediaError="";
  const dataUrl=first.dataUrl;
  if(activeType==="photo"){
    photos=sourceImages.map(image=>withPlainOverlayDefaults_({dataUrl:image.dataUrl,name:image.imageName||"submission.jpg",mediaType:image.imageType||"image/jpeg",overlayCaption:image.overlayCaption||"",size:0}));syncCurrentSlides_();renderThumbs();
    const drop=document.getElementById("drop");if(drop)drop.innerHTML=`${photos.length} source image${photos.length===1?"":"s"} loaded ✓ — <b>click or drop to add more</b><br><span style="font-size:12px">Verify credit and reuse rights before approval</span>`;
  }else if(activeType==="reel"){
    reelCover=dataUrl;renderReelThumb();
  }else{
    figure={dataUrl,name:reviewSource.imageName,mediaType:reviewSource.imageType};renderFigThumb();
    const drop=document.getElementById("figDrop");if(drop)drop.innerHTML='Source image loaded ✓ — <b>click or drop to replace it</b>';
  }
  if(currentGraphic){currentGraphic.figure=dataUrl;if(document.getElementById("cardDisp"))drawCard("cardDisp");}
  renderLoadedReviewBanner();
}
function applyReviewSubmission(item){
  reviewSource=item;paperMeta=null;photos=[];figure=null;reelCover=null;reelVideoLink="";currentSlides=[];activeSlideIndex=0;
  const map={Paper:"paper",Event:"event",Photo:"photo",Video:"reel","Shout-out":"repost"};
  activeType=map[item.type]||"photo";
  const dataUrl=item.imageBase64?`data:${item.imageType||"image/jpeg"};base64,${item.imageBase64}`:"";
  if(dataUrl){
    if(activeType==="photo")photos=[withPlainOverlayDefaults_({dataUrl,name:item.imageName||"submission.jpg",mediaType:item.imageType||"image/jpeg",overlayCaption:(item.overlayCaptions||[])[0]||"",size:0})];
    else if(activeType==="reel")reelCover=dataUrl;
    else figure={dataUrl,name:item.imageName||"submission.jpg",mediaType:item.imageType||"image/jpeg"};
  }
  renderTypes();renderForm();
  const draftDetails=reviewDetailsForDraft_(item);
  const context=[item.title,draftDetails].filter(Boolean).join("\n\n");
  if(activeType==="paper"){setField("doi",item.link);setField("paperText",context);setField("paperCredit",defaultPaperCredit_());}
  if(activeType==="event"){setField("evTitle",item.title);setField("evDate",item.date);setField("evTime",item.time);setField("evLoc",item.location);setField("evDesc",draftDetails);setField("evLink",item.link);}
  if(activeType==="photo")setField("photoNote",context);
  if(activeType==="reel"){setField("reelLink",item.videoLink);setField("reelNote",context);reelVideoLink=item.videoLink||"";}
  if(activeType==="repost"){setField("rpHandle",item.credit);setField("rpWhat",context);setField("rpWhy",item.submitter==="Discovery Bot"?"Identified from an official source for department review":"Submitted by "+(item.submitter||"department member"));setField("rpLink",item.link);}
  window.scrollTo({top:0,behavior:"smooth"});
  refreshDraftAction_();
}
function reviewDetailsForDraft_(item){
  const raw=String(item&&item.details||"").trim();
  if(!raw)return "";
  const marked=raw.match(/(?:^|\n)FACTS FOR DRAFT:\s*\n?([\s\S]*?)(?=\n+(?:REVIEW NOTE|IMAGE CREDIT|IMAGE SOURCE|IMAGE TYPE|RIGHTS CHECK|DISCOVERY MONITOR ID):|$)/i);
  if(marked&&marked[1].trim())return marked[1].trim();
  return raw
    .replace(/This may feature a student, alumnus, program, team, or faculty member\.?/gi,"")
    .split(/\r?\n/)
    .filter(line=>!/^\s*(?:Open the original (?:article|page)|Verify final publication status|REVIEW NOTE:|IMAGE CREDIT:|IMAGE SOURCE:|IMAGE TYPE:|RIGHTS CHECK:|DISCOVERY MONITOR ID:)/i.test(line))
    .join("\n")
    .replace(/\n{3,}/g,"\n\n")
    .trim();
}
function setField(id,value){const el=document.getElementById(id);if(el)el.value=value||"";}

function modal(html,wide=false){const s=document.createElement("div");s.className="scrim";s.id="scrim";s.innerHTML=`<div class="modal${wide?" wide":""}">${html}</div>`;s.onclick=e=>{if(e.target===s)closeModal();};document.body.appendChild(s);}

/* ===== utils ===== */
function val(id){const e=document.getElementById(id);return e?(e.value||"").trim():"";}
function extractDriveFileId(input){
  const s=String(input||"").trim();
  if(/^[A-Za-z0-9_-]{20,}$/.test(s))return s;
  const path=s.match(/\/file\/d\/([A-Za-z0-9_-]{20,})/);
  if(path)return path[1];
  const query=s.match(/[?&]id=([A-Za-z0-9_-]{20,})/);
  return query?query[1]:"";
}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function copy(t,m){navigator.clipboard.writeText(t).then(()=>toast(m)).catch(()=>toast("Copy failed"));}
let toastTimer;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2400);}
